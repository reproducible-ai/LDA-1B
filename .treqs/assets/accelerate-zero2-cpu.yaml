compute_environment: LOCAL_MACHINE
# Legacy filenames retained; optimizer offload is disabled in the JSON config.
debug: false
deepspeed_config:
  deepspeed_config_file: .treqs/assets/deepspeed-zero2-cpu.json
  deepspeed_multinode_launcher: standard
  zero3_init_flag: false
distributed_type: DEEPSPEED
downcast_bf16: "no"
enable_cpu_affinity: false
machine_rank: 0
main_training_function: main
# Precision is owned by deepspeed-zero2-cpu.json. Accelerate rejects
# mixed_precision here when deepspeed_config_file is supplied.
num_machines: 1
num_processes: 1
rdzv_backend: static
same_network: true
use_cpu: false
